<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}youtube-automation{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  {% if usuario %}
  <nav class="nav">
    <div class="nav-marca">youtube-automation</div>
    <a href="/app/episodios">Episodios</a>
    <a href="/app/personajes">Personajes</a>
    <a href="/app/fondos">Fondos</a>
    <a href="/app/objetos">Objetos</a>
    <a href="/app/jobs">Jobs</a>
    <span class="nav-spacer"></span>
    <span class="nav-usuario">{{ usuario.email }}</span>
    <button id="btn-logout" class="btn-link">Salir</button>
  </nav>
  {% endif %}
  <main class="contenido">
    {% block contenido %}{% endblock %}
  </main>
  <script src="/static/app.js"></script>
  {% block script %}{% endblock %}
</body>
</html>
